# ---------------------------------------------------------------------------
# KAYAK Bid Optimizer Pro — local development stack.
# One command starts everything:  docker compose up --build
# NOTE: This is the LOCAL DEVELOPMENT runtime only. Production frontend deploys
# to Vercel and backend to Railway/Render (see docs/adr/0008).
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kayak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kayak}
      POSTGRES_DB: ${POSTGRES_DB:-kayak_bid_optimizer}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kayak} -d ${POSTGRES_DB:-kayak_bid_optimizer}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kayak}:${POSTGRES_PASSWORD:-kayak}@db:5432/${POSTGRES_DB:-kayak_bid_optimizer}
      NODE_ENV: ${NODE_ENV:-development}
      CORS_ORIGINS: http://localhost:3000
      LOG_FORMAT: json
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://localhost:8000/api/health'').status==200 else 1)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
